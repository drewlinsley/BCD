# XcodeGen manifest — generates BCDApp.xcodeproj from source, so the repo never commits a
# fragile .xcodeproj. Run `make ios-gen` (or `xcodegen generate` here). The app builds
# against the iOS 26 SDK (Xcode 26 on this machine); deployment target is iOS 18 so the
# on-device-model install base isn't cut off.
name: BCDApp

options:
  bundleIdPrefix: com.bcd
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  BCDKit:
    path: BCDKit

# Machine-specific values (Team ID for device signing, API base URL) live in
# Local.xcconfig — gitignored, bootstrapped from Local.xcconfig.example by `make ios-gen`.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM comes from Local.xcconfig — set it there to run on a device.

targets:
  BCDApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BCDApp/Sources
      - path: BCDApp/Resources
    dependencies:
      - package: BCDKit
    info:
      path: BCDApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: "BCD"
        # Wired to the build setting so `xcodebuild CURRENT_PROJECT_VERSION=<n>` stamps the
        # bundle. Without it every build installed as version 1, and `devicectl device info
        # apps` could not tell one from another -- which is how several rounds of camera
        # testing ran against a build that was installed but never relaunched.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Launch screen paints the identity: the scan-frame mark on brand ink, both from
        # the asset catalog so light/dark resolve the same way the app does.
        UILaunchScreen:
          UIColorName: BrandInk
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Camera is the core surface; App Store requires a purpose string.
        NSCameraUsageDescription: "BCD uses the camera to identify beers and spirits in front of you."
        NSLocationWhenInUseUsageDescription: "BCD uses your location to match what's on the menu or shelf at this venue."
        # Age gate: alcohol content requires a 17+ rating and an age check.
        ITSAppUsesNonExemptEncryption: false
        # API base URL, composed from Local.xcconfig at build time (scheme + host:port kept
        # separate there because "//" starts a comment in an xcconfig). A device build points
        # at your Mac, not localhost. Read in BCDApp.swift.
        BCDAPIBase: "$(BCD_API_SCHEME)://$(BCD_API_HOSTPORT)"
    settings:
      base:
        # Bundle ID comes from Local.xcconfig (BCD_BUNDLE_ID) — a free Apple ID can't register
        # a generic id like com.bcd.app, so each developer sets a unique one there, keeping it
        # out of the shared repo (same pattern as DEVELOPMENT_TEAM).
        PRODUCT_BUNDLE_IDENTIFIER: $(BCD_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true

  BCDAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BCDApp/Tests
    dependencies:
      - target: BCDApp
      - package: BCDKit

schemes:
  BCDApp:
    build:
      targets:
        BCDApp: all
        BCDAppTests: [test]
    test:
      targets:
        - BCDAppTests
